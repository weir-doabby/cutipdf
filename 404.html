<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CutiPDF • Redirecting...</title>
  <script>
    (function() {
      // Single Page App redirect for GitHub Pages
      // Encodes the path and query into ?p= parameter and redirects to index.html
      var l = window.location;
      var path = l.pathname;
      var isRepo = path.indexOf('/cutipdf') === 0;
      var basePath = isRepo ? '/cutipdf/' : '/';
      
      var targetPath = path;
      if (isRepo) {
        targetPath = path.substring('/cutipdf'.length);
      }
      targetPath = targetPath.replace(/^\/+/, '');

      var query = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash || '';

      var redirectUrl = basePath + '?p=' + encodeURIComponent(targetPath) + query + hash;
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body style="background:#09090b;color:#f43f5e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <p style="font-size:18px;font-weight:bold;color:#ff5277;margin:0 0 8px 0;">CutiPDF</p>
    <p style="font-size:13px;color:#a1a1aa;margin:0;">Redirecting to tool...</p>
  </div>
</body>
</html>
