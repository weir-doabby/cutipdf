<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CutiPDF • Clean & Fast PDF Tools</title>
  
  <meta name="description" content="CutiPDF — Minimalist, fast, and private PDF tools. Convert JPG to PDF, merge documents, and more with 100% in-browser processing.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- PDF-Lib & Canvas Confetti -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-red-500/20 selection:text-[#e63946]">

  <!-- Global Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
    <div class="flex items-center gap-2 bg-zinc-900/90 dark:bg-white/95 text-white dark:text-zinc-900 px-5 py-2.5 rounded-full shadow-lg text-xs font-semibold backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-[#e63946]"></span>
      <span id="toastMessage">Success</span>
    </div>
  </div>

  <!-- Clean Top Header -->
  <header class="w-full max-w-6xl mx-auto px-5 py-4 flex items-center justify-between border-b border-zinc-200/80 dark:border-zinc-800/80">
    <!-- Brand Logo -->
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="showAllTools()">
      <img src="assets/logo_clean.png" alt="CutiPDF" class="h-9 w-auto object-contain">
      <span class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">CutiPDF</span>
    </div>

    <!-- Dark / Light Mode Toggle -->
    <button id="themeToggle" class="w-9 h-9 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 flex items-center justify-center hover:border-zinc-300 dark:hover:border-zinc-600 transition-colors shadow-2xs" title="Toggle Theme">
      <span id="themeIcon"></span>
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-6xl mx-auto px-5 py-8 flex-1">

    <!-- ============================================================ -->
    <!-- VIEW 1: ALL TOOLS CATALOG (iLovePDF Clean Organization) -->
    <!-- ============================================================ -->
    <div id="view-all-tools" class="view-container active space-y-10">
      
      <!-- Clean Welcome Header -->
      <div class="text-center max-w-2xl mx-auto space-y-2 py-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100 tracking-tight">Every tool you need to work with PDFs</h1>
        <p class="text-sm text-zinc-500 dark:text-zinc-400">All 100% free, easy to use, and processed privately in your browser.</p>
      </div>

      <!-- Categories & Tools Grid -->
      <div id="toolsGridContainer" class="space-y-10">
        <!-- Injected dynamically from TOOLS_CATALOG in app.js -->
      </div>

    </div>

    <!-- ============================================================ -->
    <!-- VIEW 2: DEDICATED TOOL PAGE (e.g. JPG to PDF) -->
    <!-- ============================================================ -->
    <div id="view-tool-active" class="view-container max-w-3xl mx-auto space-y-8">
      
      <!-- Back Navigation -->
      <div>
        <button id="btnBackToTools" class="inline-flex items-center gap-1.5 text-xs font-semibold text-zinc-500 dark:text-zinc-400 hover:text-[#e63946] dark:hover:text-[#e63946] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span>All PDF Tools</span>
        </button>
      </div>

      <!-- Tool Header -->
      <div class="text-center space-y-2">
        <div id="toolIcon" class="text-5xl mx-auto">🖼️</div>
        <h2 id="toolTitle" class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100">JPG to PDF</h2>
        <p id="toolDesc" class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 max-w-md mx-auto">
          Convert JPG, PNG, and WebP images to PDF in seconds.
        </p>
      </div>

      <!-- Upload Dropzone (iLovePDF Style) -->
      <div id="toolDropzone" class="tool-dropzone p-12 sm:p-16 text-center cursor-pointer group">
        <input type="file" id="fileInput" class="hidden" multiple>

        <div class="flex flex-col items-center justify-center space-y-4">
          <button id="btnSelectFiles" class="btn-primary-action text-sm sm:text-base">
            Select JPG images
          </button>
          <p id="dropzoneText" class="text-xs text-zinc-400 dark:text-zinc-500">
            or drop files here
          </p>
        </div>
      </div>

      <!-- Selected Files Workspace & Action Button -->
      <div id="filesSelectedArea" class="hidden space-y-6">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-bold text-zinc-700 dark:text-zinc-300">Selected Files</span>
          <button id="btnClearFiles" class="text-xs text-zinc-400 hover:text-red-500 transition-colors">
            Clear all
          </button>
        </div>

        <!-- Files List -->
        <div id="selectedFilesList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1"></div>

        <!-- Convert Action Button -->
        <div class="text-center pt-2">
          <button id="btnExecuteAction" class="btn-primary-action w-full py-4 text-base">
            <span id="actionButtonText">Convert to PDF</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- ============================================================ -->
  <!-- FLOATING SQUARE TOOLS BUTTON (Two Wrenches Icon) -->
  <!-- ============================================================ -->
  <button id="floatingToolsBtn" class="floating-tools-btn" title="All PDF Tools">
    <!-- Two Crossed Wrenches / Tools Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      <path d="m3 21 3-3"/>
      <path d="m14 10 4 4"/>
      <path d="m19 15 2 2"/>
    </svg>
    <span>Tools</span>
  </button>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
