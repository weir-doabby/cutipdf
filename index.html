<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CutiPDF • Clean, Fast & Complete PDF Studio</title>
  
  <meta name="description" content="CutiPDF — All 30 PDF tools working 100% in your browser. Fast, free, and private PDF processing without uploading to any server.">
  <!-- Cute Strawberry Favicon (توت فرنگی) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Immediate Theme Initializer: Default to Light Mode -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('cutipdf_theme_v3');
      if (!savedTheme) {
        savedTheme = 'light';
        localStorage.setItem('cutipdf_theme_v3', 'light');
      }
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- GitHub Pages SPA Path Restorer -->
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const p = urlParams.get('p');
      if (p) {
        const isRepo = window.location.pathname.startsWith('/cutipdf');
        const basePath = isRepo ? '/cutipdf/' : '/';
        const cleanPath = p.replace(/^\/+/, '').replace(/\/+$/, '');
        window.history.replaceState(null, '', basePath + cleanPath + window.location.hash);
      }
    })();
  </script>

  <!-- Google Fonts: Kaushan Script (Brush), Caveat & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Client-Side Engine Libraries -->
  <!-- 1. PDF-Lib -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- 2. PDF.js (Mozilla Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <!-- 3. JSZip (ZIP Packaging) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- 4. SheetJS (Excel Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- 5. Mammoth (Word DOCX Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- 6. Confetti Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css?v=20261115e">
</head>
<body class="watercolor-paper-bg selection:bg-pink-500/20 selection:text-[#ff5277]">

  <!-- Global Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
    <div class="flex items-center gap-2 bg-zinc-900/95 dark:bg-white/95 text-white dark:text-zinc-900 px-5 py-2.5 rounded-full shadow-xl text-xs font-semibold backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-[#ff5277]"></span>
      <span id="toastMessage">Success</span>
    </div>
  </div>

  <!-- Clean Top Header (Corner-Aligned with Tools Button) -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-zinc-200/80 dark:border-zinc-800/80">
    <!-- Brand: Left Corner (Cuti in dark/light, PDF in Pink) -->
    <a id="brandLogoLink" href="./" class="flex items-center cursor-pointer no-underline text-inherit group" title="CutiPDF Home">
      <span class="text-2xl sm:text-3xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:opacity-90 transition-opacity font-brush">
        Cuti<span class="text-[#ff5277] drop-shadow-xs">PDF</span>
      </span>
    </a>

    <!-- Dark / Light Mode Toggle (Right Side) -->
    <button id="themeToggle" class="w-9 h-9 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 flex items-center justify-center hover:border-zinc-300 dark:hover:border-zinc-600 transition-colors shadow-2xs" title="Toggle Theme">
      <span id="themeIcon"></span>
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-6xl mx-auto px-5 py-8 flex-1">

    <!-- ============================================================ -->
    <!-- VIEW 1: ALL TOOLS CATALOG (Full iLovePDF Suite) -->
    <!-- ============================================================ -->
    <div id="view-all-tools" class="view-container active space-y-10">
      
      <!-- Clean Welcome Header with (pdf tool box, but lovely) -->
      <div class="text-center max-w-3xl mx-auto space-y-1.5 py-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100 tracking-tight">
          Every tool you need to work with PDFs
        </h1>
        <p class="text-base sm:text-lg font-brush text-[#ff5277] font-semibold tracking-wide">
          (pdf tool box, but lovely)
        </p>
      </div>

      <!-- Categories & Tools Grid -->
      <div id="toolsGridContainer" class="space-y-10">
        <!-- Injected dynamically from TOOLS_CATALOG in app.js -->
      </div>

    </div>

    <!-- ============================================================ -->
    <!-- VIEW 2: DEDICATED TOOL PAGE FOR EACH TOOL -->
    <!-- ============================================================ -->
    <div id="view-tool-active" class="view-container max-w-4xl mx-auto space-y-8">

      <!-- Tool Header with Gorgeous Vector (Centered) -->
      <div class="text-center space-y-3">
        <div id="toolVectorContainer" class="w-20 h-20 sm:w-24 sm:h-24 mx-auto flex items-center justify-center drop-shadow-sm">
          <!-- Injected SVG Vector -->
        </div>

        <div>
          <h2 id="toolTitle" class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100">Tool Name</h2>
        </div>

        <p id="toolDesc" class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 max-w-md mx-auto leading-relaxed">
          Description
        </p>
      </div>

      <!-- Tool Options Drawer (Dynamic for tools like Watermark, Password, Page Numbers, Layout) -->
      <div id="toolOptionsDrawer" class="hidden cuti-card p-4 sm:p-5 bg-white dark:bg-zinc-900 border border-pink-200 dark:border-zinc-800 rounded-2xl space-y-3">
        <!-- Injected options -->
      </div>

      <!-- Upload Section (Responsive: Large Touch Button on Mobile, Comfortable Dropzone on Desktop) -->
      <div id="toolDropzone" class="tool-dropzone p-4 sm:p-14 text-center cursor-pointer group">
        <input type="file" id="fileInput" class="hidden" multiple>

        <div class="flex flex-col items-center justify-center space-y-3.5">
          <!-- Main Action Buttons Wrap (Responsive: Stacked on Mobile like iLovePDF, Inline with Balancer on Desktop) -->
          <div class="action-buttons-wrap">
            <!-- Invisible Balancer on Left: balances the 48px cloud buttons on desktop to center Select button with 'or drop files here' -->
            <div class="desktop-balancer" aria-hidden="true"></div>

            <!-- Big Primary Select Files Button (iLovePDF Style: Large touch target, 72px height, 20px bold font) -->
            <button id="btnSelectFiles" type="button" class="btn-primary-action">
              Select PDF files
            </button>

            <!-- Cloud Source Buttons (Underneath in row on Mobile; Vertically Stacked beside Select on Desktop) -->
            <div class="cloud-buttons-wrap">
              <!-- Google Drive Button -->
              <button id="btnGoogleDrive" type="button" class="btn-cloud-source group/cloud" title="Select files from Google Drive" aria-label="Google Drive">
                <svg class="w-5 h-5 fill-white transition-transform group-hover/cloud:scale-115" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                  <path d="M339 314.9L175.4 32h161.2l163.6 282.9H339zm-137.5 23.6L120.9 480h310.5L512 338.5H201.5zM154.1 67.4L0 338.5 80.6 480 237 208.8 154.1 67.4z"/>
                </svg>
              </button>

              <!-- Dropbox Button -->
              <button id="btnDropbox" type="button" class="btn-cloud-source group/cloud" title="Select files from Dropbox" aria-label="Dropbox">
                <svg class="w-5 h-5 fill-white transition-transform group-hover/cloud:scale-115" viewBox="0 0 528 512" xmlns="http://www.w3.org/2000/svg">
                  <path d="M264.4 116.3l-132 84.3 132 84.3-132 84.3L0 284.1l132.3-84.3L0 116.3 132.3 32l132.1 84.3zM131.6 395.7l132-84.3 132 84.3-132 84.3-132-84.3zm132.8-111.6l132-84.3-132-83.6L395.7 32 528 116.3l-132.3 84.3L528 284.8l-132.3 84.3-131.3-85z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Drop text only on desktop -->
          <p id="dropzoneText" class="hidden sm:block text-xs text-zinc-400 dark:text-zinc-500 font-medium">
            or drop files here
          </p>
        </div>
      </div>

      <!-- Selected Files Workspace & Action Button (Interactive Thumbnail Grid) -->
      <div id="filesSelectedArea" class="hidden space-y-6">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-zinc-800 dark:text-zinc-200">Interactive Preview Workspace</span>
            <span class="text-[11px] text-zinc-400">Click rotate or arrows to rearrange</span>
          </div>
          <button id="btnClearFiles" class="text-xs text-zinc-400 hover:text-red-500 transition-colors">
            Clear all
          </button>
        </div>

        <!-- Files / Pages Thumbnail Grid -->
        <div id="selectedFilesList" class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>

        <!-- Convert Action Button -->
        <div class="text-center pt-2">
          <button id="btnExecuteAction" class="btn-primary-action w-full py-4 text-base">
            <span id="actionButtonText">Process Files</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- ============================================================ -->
  <!-- FLOATING ROYAL BLUE TOOLS BUTTON (Adobe Stock Gear & Wrench Logo) -->
  <!-- ============================================================ -->

    <!-- Animated Gear Playing Around Stationary Wrench (Exact Adobe Stock Tool Logo) -->

        <!-- Stationary Wrench (Fixed Rock-Solid In Center) -->
        <path class="tool-wrench" d="M 248.9 204.8 L 263.1 204.8 L 264.5 206.2 L 274.5 207.6 L 287.3 214.8 L 297.2 224.7 L 304.4 237.5 L 304.4 240.4 L 307.2 246.0 L 307.2 270.2 L 310.0 271.6 L 328.5 290.1 L 328.5 291.6 L 331.4 293.0 L 339.9 301.5 L 339.9 302.9 L 342.8 304.4 L 354.1 315.7 L 354.1 317.2 L 362.7 324.3 L 368.4 332.8 L 368.4 335.6 L 369.8 337.1 L 369.8 351.3 L 365.5 359.8 L 358.4 366.9 L 349.9 371.2 L 335.6 371.2 L 328.5 368.4 L 324.3 365.5 L 267.4 308.6 L 253.2 310.0 L 251.7 308.6 L 243.2 308.6 L 241.8 307.2 L 234.7 305.8 L 224.7 300.1 L 211.9 287.3 L 206.2 275.9 L 204.8 267.4 L 203.4 266.0 L 203.4 248.9 L 204.8 247.5 L 204.8 243.2 L 207.6 238.9 L 241.8 273.1 L 244.6 274.5 L 253.2 274.5 L 273.1 254.6 L 273.1 246.0 L 271.6 243.2 L 237.5 209.1 L 241.8 206.2 L 247.5 206.2 L 248.9 204.8 Z" />
      </svg>
    </div>
    <span>Tools</span>
  </button>

  <!-- ============================================================ -->
  <!-- QUICK TOOLS SIDE PREVIEW DRAWER (Slide-out Side Pop Menu) -->
  <!-- ============================================================ -->
  <div id="quickToolsBackdrop" class="fixed inset-0 z-[60] bg-zinc-950/40 dark:bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <aside id="quickToolsDrawer" class="fixed top-0 right-0 bottom-0 z-[65] w-full sm:w-[460px] md:w-[480px] bg-white dark:bg-zinc-900 border-l border-pink-100 dark:border-zinc-800 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out pointer-events-none" style="height: 100dvh; max-height: 100vh;">
    <!-- Drawer Top Bar (Clean Full-Width Search Bar - No Clutter) -->
    <div class="px-4 py-3.5 border-b border-zinc-200/80 dark:border-zinc-800 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md flex-shrink-0">
      <div class="relative w-full">
        <input type="text" id="quickToolSearch" placeholder="Search tools (e.g. merge, compress, word, jpg...)" class="w-full pl-9 pr-4 py-2.5 text-xs rounded-xl border border-pink-200/80 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100 outline-none focus:border-[#ff5277] transition-all">
        <svg class="w-4 h-4 absolute left-3 top-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- Drawer Tools Grid (Scrollable) -->
    <div id="quickToolsModalGrid" class="p-5 overflow-y-auto space-y-5 flex-1 overscroll-contain" style="padding-bottom: 96px;">
      <!-- Injected dynamically -->
    </div>
  </aside>

  <!-- Vector Illustrations Library -->
  <script src="vectors.js?v=20261115e"></script>
  <!-- Main Application Script -->
  <script src="app.js?v=20261115e"></script>
</body>
</html>
