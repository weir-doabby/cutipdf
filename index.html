<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CutiPDF • Clean, Fast & Complete PDF Studio</title>
  
  <meta name="description" content="CutiPDF — All 30 PDF tools working 100% in your browser. Fast, free, and private PDF processing without uploading to any server.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Client-Side Engine Libraries -->
  <!-- 1. PDF-Lib -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- 2. PDF.js (Mozilla Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <!-- 3. JSZip (ZIP Packaging) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- 4. SheetJS (Excel Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- 5. Mammoth (Word DOCX Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- 6. Confetti Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="watercolor-paper-bg selection:bg-pink-500/20 selection:text-[#ff5277]">

  <!-- Global Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
    <div class="flex items-center gap-2 bg-zinc-900/95 dark:bg-white/95 text-white dark:text-zinc-900 px-5 py-2.5 rounded-full shadow-xl text-xs font-semibold backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-[#e63946]"></span>
      <span id="toastMessage">Success</span>
    </div>
  </div>

  <!-- Clean Top Header -->
  <header class="w-full max-w-6xl mx-auto px-5 py-4 flex items-center justify-between border-b border-zinc-200/80 dark:border-zinc-800/80">
    <!-- Brand Logo -->
    <a href="#all-tools" class="flex items-center gap-2.5 cursor-pointer no-underline text-inherit">
      <img src="assets/logo_clean.png" alt="CutiPDF" class="h-9 w-auto object-contain">
      <span class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">CutiPDF</span>
    </a>

    <!-- Dark / Light Mode Toggle -->
    <button id="themeToggle" class="w-9 h-9 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 flex items-center justify-center hover:border-zinc-300 dark:hover:border-zinc-600 transition-colors shadow-2xs" title="Toggle Theme">
      <span id="themeIcon"></span>
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-6xl mx-auto px-5 py-8 flex-1">

    <!-- ============================================================ -->
    <!-- VIEW 1: ALL TOOLS CATALOG (Full iLovePDF Suite) -->
    <!-- ============================================================ -->
    <div id="view-all-tools" class="view-container active space-y-10">
      
      <!-- Clean Welcome Header -->
      <div class="text-center max-w-2xl mx-auto space-y-2 py-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100 tracking-tight">Every tool you need to work with PDFs</h1>
        <p class="text-sm text-zinc-500 dark:text-zinc-400">All tools work 100% in your browser. Fast, private, and zero server upload.</p>
      </div>

      <!-- Categories & Tools Grid -->
      <div id="toolsGridContainer" class="space-y-10">
        <!-- Injected dynamically from TOOLS_CATALOG in app.js -->
      </div>

    </div>

    <!-- ============================================================ -->
    <!-- VIEW 2: DEDICATED TOOL PAGE FOR EACH TOOL -->
    <!-- ============================================================ -->
    <div id="view-tool-active" class="view-container max-w-3xl mx-auto space-y-8">
      
      <!-- Back Navigation -->
      <div>
        <button id="btnBackToTools" class="inline-flex items-center gap-1.5 text-xs font-semibold text-zinc-500 dark:text-zinc-400 hover:text-[#e63946] dark:hover:text-[#e63946] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span>All PDF Tools</span>
        </button>
      </div>

      <!-- Tool Header with Gorgeous Vector -->
      <div class="text-center space-y-3">
        <div id="toolVectorContainer" class="w-20 h-20 sm:w-24 sm:h-24 mx-auto flex items-center justify-center drop-shadow-sm">
          <!-- Injected SVG Vector -->
        </div>

        <div>
          <div class="inline-block mb-1.5">
            <span id="toolStatusBadge" class="text-[11px] font-semibold px-3 py-0.5 rounded-full text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800">
              100% Client-Side
            </span>
          </div>
          <h2 id="toolTitle" class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-zinc-100">Tool Name</h2>
        </div>

        <p id="toolDesc" class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 max-w-md mx-auto leading-relaxed">
          Description
        </p>
      </div>

      <!-- Tool Options Drawer (Dynamic for tools like Watermark, Password, Page Numbers) -->
      <div id="toolOptionsDrawer" class="hidden cuti-card p-4 sm:p-5 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl space-y-3">
        <!-- Injected options (e.g. password input, watermark text, rotation angle) -->
      </div>

      <!-- Upload Dropzone (iLovePDF Style) -->
      <div id="toolDropzone" class="tool-dropzone p-12 sm:p-16 text-center cursor-pointer group">
        <input type="file" id="fileInput" class="hidden" multiple>

        <div class="flex flex-col items-center justify-center space-y-4">
          <button id="btnSelectFiles" class="btn-primary-action text-sm sm:text-base">
            Select files
          </button>
          <p id="dropzoneText" class="text-xs text-zinc-400 dark:text-zinc-500">
            or drop files here
          </p>
        </div>
      </div>

      <!-- Selected Files Workspace & Action Button -->
      <div id="filesSelectedArea" class="hidden space-y-6">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-bold text-zinc-700 dark:text-zinc-300">Selected Files</span>
          <button id="btnClearFiles" class="text-xs text-zinc-400 hover:text-red-500 transition-colors">
            Clear all
          </button>
        </div>

        <!-- Files List -->
        <div id="selectedFilesList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1"></div>

        <!-- Convert Action Button -->
        <div class="text-center pt-2">
          <button id="btnExecuteAction" class="btn-primary-action w-full py-4 text-base">
            <span id="actionButtonText">Process Files</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- ============================================================ -->
  <!-- FLOATING SQUARE TOOLS BUTTON (Clean Ergonomic Wrench) -->
  <!-- ============================================================ -->
  <button id="floatingToolsBtn" class="floating-tools-btn" title="All PDF Tools">
    <!-- Pure Ergonomic Spanner Wrench - Single Continuous Path with Zero Inner Lines -->
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#ff5277]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <span>Tools</span>
  </button>

  <!-- Vector Illustrations Library -->
  <script src="vectors.js"></script>
  <!-- Main Application Engine -->
  <script src="app.js"></script>
</body>
</html>
