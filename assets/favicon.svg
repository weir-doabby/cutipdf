<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Berry Body Gradient -->
    <linearGradient id="berryGrad" x1="25%" y1="15%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#ff5e83"/>
      <stop offset="35%" stop-color="#ff2a5f"/>
      <stop offset="75%" stop-color="#e11447"/>
      <stop offset="100%" stop-color="#b90a36"/>
    </linearGradient>

    <!-- Berry Ambient Shadow/3D Gradient -->
    <radialGradient id="berryShine" cx="35%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff2a5f" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaves Gradient -->
    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Seed Drop Shadow -->
    <filter id="seedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.4" flood-color="#880b28" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ground / Drop Shadow -->
  <ellipse cx="64" cy="122" rx="28" ry="4" fill="rgba(0,0,0,0.12)"/>

  <!-- Strawberry Body -->
  <path d="M 64 36 C 96 34, 116 52, 114 80 C 111 103, 86 118, 64 122 C 42 118, 17 103, 14 80 C 12 52, 32 34, 64 36 Z" 
        fill="url(#berryGrad)"/>
  
  <!-- Soft Radial Volume Glow -->
  <path d="M 64 36 C 96 34, 116 52, 114 80 C 111 103, 86 118, 64 122 C 42 118, 17 103, 14 80 C 12 52, 32 34, 64 36 Z" 
        fill="url(#berryShine)"/>

  <!-- Glossy Shoulder Highlight (Juicy 3D sheen) -->
  <path d="M 28 54 C 23 66, 25 80, 32 90 C 29 86, 26 73, 30 62 C 34 52, 44 45, 52 43 C 44 43, 34 46, 28 54 Z" 
        fill="#ffffff" opacity="0.45"/>

  <!-- Golden Strawberry Seeds -->
  <g fill="#fef08a" filter="url(#seedShadow)">
    <!-- Row 1 -->
    <ellipse cx="46" cy="56" rx="2.2" ry="3.6" transform="rotate(-15 46 56)"/>
    <ellipse cx="64" cy="54" rx="2.2" ry="3.6"/>
    <ellipse cx="82" cy="56" rx="2.2" ry="3.6" transform="rotate(15 82 56)"/>

    <!-- Row 2 -->
    <ellipse cx="34" cy="72" rx="2.2" ry="3.6" transform="rotate(-20 34 72)"/>
    <ellipse cx="53" cy="72" rx="2.2" ry="3.6" transform="rotate(-8 53 72)"/>
    <ellipse cx="75" cy="72" rx="2.2" ry="3.6" transform="rotate(8 75 72)"/>
    <ellipse cx="94" cy="72" rx="2.2" ry="3.6" transform="rotate(20 94 72)"/>

    <!-- Row 3 -->
    <ellipse cx="42" cy="88" rx="2.2" ry="3.6" transform="rotate(-14 42 88)"/>
    <ellipse cx="64" cy="88" rx="2.2" ry="3.6"/>
    <ellipse cx="86" cy="88" rx="2.2" ry="3.6" transform="rotate(14 86 88)"/>

    <!-- Row 4 -->
    <ellipse cx="52" cy="103" rx="2" ry="3.2" transform="rotate(-10 52 103)"/>
    <ellipse cx="76" cy="103" rx="2" ry="3.2" transform="rotate(10 76 103)"/>

    <!-- Row 5 (Tip) -->
    <ellipse cx="64" cy="114" rx="1.8" ry="2.8"/>
  </g>

  <!-- Calyx Leaves (Spreading Crown) -->
  <!-- Far Left Leaf -->
  <path d="M 62 38 C 44 38, 26 43, 16 50 C 26 44, 46 41, 60 38 Z" fill="url(#leafGrad)"/>
  <!-- Left-Center Leaf -->
  <path d="M 63 38 C 47 48, 38 60, 36 68 C 43 59, 53 49, 62 38 Z" fill="url(#leafGrad)"/>
  <!-- Center Leaf -->
  <path d="M 62 38 C 58 52, 60 66, 64 74 C 68 66, 70 52, 66 38 Z" fill="url(#leafGrad)"/>
  <!-- Right-Center Leaf -->
  <path d="M 65 38 C 75 49, 85 59, 92 68 C 90 60, 81 48, 65 38 Z" fill="url(#leafGrad)"/>
  <!-- Far Right Leaf -->
  <path d="M 66 38 C 82 41, 102 44, 112 50 C 102 43, 84 38, 66 38 Z" fill="url(#leafGrad)"/>

  <!-- Stem -->
  <path d="M 62 38 C 61 24, 66 13, 77 8 C 76 15, 71 24, 67 38 Z" fill="url(#stemGrad)"/>
</svg>